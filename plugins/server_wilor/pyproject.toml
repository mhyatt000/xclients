[project]
name = "server-wilor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chumpy",
    "dill>=0.4.1",
    "tyro>=1.0.11",
    "webpolicy",
    "wilor-mini",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    "chumpy @ git+https://github.com/mhyatt000/chumpy",
    # wilor-mini pins torch<=2.5, which lacks sm_120 (RTX 5090) kernels
    "torch>=2.9.1",
    "torchvision>=0.24",
    # wilor-mini pins ultralytics==8.1.34, which breaks under torch>=2.6 weights_only loading
    "ultralytics>=8.3",
]

[tool.uv.sources]
chumpy = { git = "https://github.com/mhyatt000/chumpy" }
wilor-mini = { git = "https://github.com/warmshao/wilor-mini" }
webpolicy = { git = "https://github.com/mhyatt000/webpolicy" }

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
